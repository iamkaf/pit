[package]
name = "pit"
version = "0.1.0"
edition = "2024"
description = "One working tree, two repositories, one safe workflow (private Git overlay)"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
globset = "0.4.19"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.3"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
